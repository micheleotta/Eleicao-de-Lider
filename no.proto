service No {
    rpc RequestVote (VoteRequest) returns (VoteResponse);
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

message VoteRequest {
    required int32 id = 1;
    required int32 termo = 2;
    required int32 indice_log = 3;
}

message VoteResponse {
    required int32 id = 1;
    required int32 termo = 2;
    required bool voto = 3;
}

message HeartbeatRequest {
    required int32 id = 1;
    optional int32 termo = 2;
    optional int32 indice_log = 3;
}

message HeartbeatResponse {
    required int32 id = 1;
    required int32 termo = 2;
    required int32 indice_log = 3;
    repeated Log logs = 4;
    required bool sucesso = 5;
    required int32 lider_id = 6;
}

message Log {
    required int32 termo = 1;
    required int32 indice = 2;
    required string comando = 3;
}