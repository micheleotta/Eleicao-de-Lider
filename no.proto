service No {
    rpc RequestVote (VoteRequest) returns (VoteResponse);
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

message VoteRequest {
    required int32 id = 1;
    required int32 termo = 2;
    required int32 indice_log = 3;
}

message VoteResponse {
    required bool voto = 1;
}

message HeartbeatRequest {
    optional int32 termo = 1;
    optional int32 indice_log = 2;
}

message HeartbeatResponse {
    required int32 termo = 1;
    required int32 indice_log = 2;
    repeated Log logs = 3;
}

message Log {
    required int32 termo = 1;
    required int32 indice = 2;
    required string comando = 3;
}