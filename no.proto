service No {
    rpc RequestVote (VoteRequest) returns (VoteResponse);
    rpc Fetch (FetchRequest) returns (FetchResponse);
}

service Servidor {
    rpc ClientWrite (WriteRequest) returns (WriteResponse);
    rpc ClientRead (ReadRequest) returns (ReadResponse);
}

message VoteRequest {
    required int32 id = 1;
    required int32 termo = 2;
    required int32 indice_log = 3;
}

message VoteResponse {
    required int32 id = 1;
    required int32 termo = 2;
    required bool voto = 3;
}

message FetchRequest {
    required int32 id = 1;
    optional int32 termo = 2;
    optional int32 indice_log = 3;
}

message FetchResponse {
    required int32 id = 1;
    required int32 termo = 2;
    required int32 indice_log = 3;
    required bool sucesso = 4;
    optional int32 lider_id = 5;
    required int32 commit_index = 6;
    repeated Log logs = 7;

}

message Log {
    required int32 termo = 1;
    required int32 indice = 2;
    required string dado = 3;
}

message WriteRequest{
    required string dado = 1;
    optional bool crash = 2;
}

message WriteResponse{
    required bool sucesso = 1;
    required int32 lider_id = 2;
    required string mensagem = 3;
}

message ReadRequest{
    optional int32 commit_index = 1;
}

message ReadResponse{
    required bool sucesso = 1;
    required int64 commit_index = 2;
    required int64 termo = 3;
    required string dado = 4;
}